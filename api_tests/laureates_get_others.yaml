config:
  target: "{{ $processEnvironment.API_HOST }}"
  plugins:
    expect: {}
  phases:
    - duration: 60
      arrivalRate: 5
      name: "Load test Nobel Laureates API"
  payload:
    path: "laureates_get_others.csv"
    fields:
      - "id"
      - "name"
      - "gender"
      - "birthCountry"
      - "nobelPrizeYear"
      - "nobelPrizeCategory"
    skipHeader: true

scenarios:
  - name: "Test Nobel Laureates API Endpoints"
    flow:
      # Scenario 1: Get Laureate by ID
      - log: "Testing get laureate by ID"
      - get:
          url: "/2.1/laureates?ID={{ id }}"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 200
            - contentType: "application/json"
      - think: 2

      # Scenario 2: Search by Name and Gender
      - log: "Testing search by name and gender"
      - get:
          url: "/2.1/laureates?name={{ name }}&gender={{ gender }}"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 200
            - hasProperty: "laureates"
      - think: 1

      # Scenario 3: Filter by Prize Category and Year
      - log: "Testing filter by prize category and year"
      - get:
          url: "/2.1/laureates?nobelPrizeCategory={{ nobelPrizeCategory }}&nobelPrizeYear={{ nobelPrizeYear }}"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 200
            - contentType: "application/json"
      - think: 2

      # Scenario 4: Invalid URL Test
      - log: "Testing invalid endpoint"
      - get:
          url: "/2.1/invalid_endpoint"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 404
      - think: 1

      # Scenario 5: Search by Birth Country
      - log: "Testing search by birth country"
      - get:
          url: "/2.1/laureates?birthCountry={{ birthCountry }}"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 200
            - hasProperty: "laureates"
            - contentType: "application/json"
      - think: 2

      # Scenario 6: Invalid Authorization Test
      - log: "Testing invalid authorization"
      - get:
          url: "/2.1/laureates"
          headers:
            Authorization: "Bearer invalid_token"
          expect:
            - statusCode: 401
      - think: 1

      # Scenario 7: Test with Multiple Parameters
      - log: "Testing multiple parameter combination"
      - get:
          url: "/2.1/laureates?nobelPrizeCategory={{ nobelPrizeCategory }}&gender={{ gender }}&limit=10&sort=desc"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 200
            - contentType: "application/json"
      - think: 2
