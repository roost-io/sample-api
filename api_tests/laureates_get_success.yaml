config:
  target: "{{$processEnvironment.API_HOST}}"
  plugins:
    expect: {}
  payload:
    path: "laureates_get_success.csv"
    skipHeader: true
    delimiter: "^|^"
    fields:
      - "name"
      - "gender"
      - "birthCity"
      - "nobelPrizeCategory"

scenarios:
  - name: "Test Laureates API Endpoint with Various Query Parameters"
    flow:
      # Basic request with pagination
      - log: "Sending GET request to fetch laureates with pagination"
      - get:
          url: "/2.1/laureates?offset=0&limit=10&sort=asc"
          headers:
            Accept: "application/json"
          expect:
            - statusCode: 200
            - hasProperty: "laureates"
            - hasProperty: "meta"
            - hasProperty: "links"
      - think: 2

      # Request with name and gender filters
      - log: "Sending GET request to fetch laureates filtered by name and gender"
      - get:
          url: "/2.1/laureates"
          qs:
            name: "{{ name }}"
            gender: "{{ gender }}"
          headers:
            Accept: "application/json"
          expect:
            - statusCode: 200
            - hasProperty: "laureates"
            - "jsonpath": "$.laureates[*].laureateIfPerson.gender"
              equals: "{{ gender }}"
      - think: 1

      # Request with location-based filters
      - log: "Sending GET request to fetch laureates filtered by birth city"
      - get:
          url: "/2.1/laureates"
          qs:
            birthCity: "{{ birthCity }}"
          headers:
            Accept: "application/json"
          expect:
            - statusCode: 200
            - hasProperty: "laureates"
            - hasProperty: "meta.birthCity"
      - think: 2

      # Request with Nobel Prize category filter
      - log: "Sending GET request to fetch laureates filtered by Nobel Prize category"
      - get:
          url: "/2.1/laureates"
          qs:
            nobelPrizeCategory: "{{ nobelPrizeCategory }}"
            limit: 5
          headers:
            Accept: "application/json"
          expect:
            - statusCode: 200
            - hasProperty: "laureates"
            - hasProperty: "meta.nobelPrizeCategory"
            - "jsonpath": "$.meta.nobelPrizeCategory"
              equals: "{{ nobelPrizeCategory }}"
      - think: 1

      # Request with multiple filters combined
      - log: "Sending GET request to fetch laureates with multiple filters"
      - get:
          url: "/2.1/laureates"
          qs:
            gender: "{{ gender }}"
            nobelPrizeCategory: "{{ nobelPrizeCategory }}"
            sort: "desc"
            limit: 3
          headers:
            Accept: "application/json"
          expect:
            - statusCode: 200
            - hasProperty: "laureates"
            - hasProperty: "meta.gender"
            - hasProperty: "meta.nobelPrizeCategory"
            - hasProperty: "meta.sort"
            - "jsonpath": "$.meta.limit"
              equals: 3
      - think: 2
