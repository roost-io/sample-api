config:
  target: "{{$processEnvironment.API_HOST}}"
  plugins:
    expect: {}
  payload:
    path: "laureate_laureateID_get_success.csv"
    skipHeader: true
    delimiter: "^|^"
    fields:
      - "laureateID"

scenarios:
  - name: "Fetch Nobel Prize Laureate Information"
    flow:
      - log: "Starting test scenario for fetching laureate information"
      
      - get:
          url: "/2.1/laureate/{{laureateID}}"
          headers:
            Accept: "application/json"
          expect:
            - statusCode: 200
            - contentType: "application/json"
            - hasProperty: "laureate"
            - hasProperty: "laureate.id"
            - hasProperty: "laureate.nobelPrizes"
            - hasProperty: "laureate.wikipedia"
            - hasProperty: "laureate.wikidata"
            - hasProperty: "laureate.sameAs"
            - hasProperty: "laureate.links"
            - isNumber: "laureate.id"
            - isArray: "laureate.nobelPrizes"
            - isArray: "laureate.sameAs"
            - isArray: "laureate.links"
            # Validating laureateIfPerson properties if present
            - hasProperty: "laureate.laureateIfPerson.knownName"
            - hasProperty: "laureate.laureateIfPerson.givenName"
            - hasProperty: "laureate.laureateIfPerson.familyName"
            - hasProperty: "laureate.laureateIfPerson.fullName"
            - hasProperty: "laureate.laureateIfPerson.gender"
            - hasProperty: "laureate.laureateIfPerson.birth"
            # Validating nobelPrizes array properties
            - hasProperty: "laureate.nobelPrizes[0].awardYear"
            - hasProperty: "laureate.nobelPrizes[0].category"
            - hasProperty: "laureate.nobelPrizes[0].categoryFullName"
            - hasProperty: "laureate.nobelPrizes[0].prizeStatus"
            - hasProperty: "laureate.nobelPrizes[0].motivation"
            - hasProperty: "laureate.nobelPrizes[0].prizeAmount"
            - hasProperty: "laureate.nobelPrizes[0].prizeAmountAdjusted"
            # Validating data types
            - isNumber: "laureate.nobelPrizes[0].awardYear"
            - isNumber: "laureate.nobelPrizes[0].prizeAmount"
            - isNumber: "laureate.nobelPrizes[0].prizeAmountAdjusted"
            # Validating specific enum values for prizeStatus
            - match:
                json: "$.laureate.nobelPrizes[0].prizeStatus"
                value: "(received|declined|restricted)"
            # Validating specific enum values for gender if person
            - match:
                json: "$.laureate.laureateIfPerson.gender"
                value: "(female|male)"

      - think: 2

      - log: "Completed laureate information fetch test"
