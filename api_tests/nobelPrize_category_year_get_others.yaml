config:
  target: "{{ $processEnvironment.API_HOST }}"
  plugins:
    expect: {}
  phases:
    - duration: 60
      arrivalRate: 5
      name: "Nobel Prize API Test"
  payload:
    path: "nobelPrize_category_year_get_others.csv"
    fields:
      - "category"
      - "year"
    skipHeader: true
    delimiter: ","

scenarios:
  - name: "Nobel Prize Information Retrieval Tests"
    flow:
      # Valid Request Scenario
      - log: "Making request for valid Nobel Prize category and year"
      - get:
          url: "/2.1/nobelPrize/{{category}}/{{year}}"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
            Accept: "application/json"
          expect:
            - statusCode: 200
            - contentType: "application/json"
            - hasHeader: "content-type"
      - think: 2

      # Invalid Category Scenario
      - log: "Testing with invalid category"
      - get:
          url: "/2.1/nobelPrize/invalid/{{year}}"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
            Accept: "application/json"
          expect:
            - statusCode: 400
      - think: 1

      # Invalid Year Scenario
      - log: "Testing with invalid year"
      - get:
          url: "/2.1/nobelPrize/{{category}}/1800"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
            Accept: "application/json"
          expect:
            - statusCode: 400
      - think: 1

      # Missing Authorization Scenario
      - log: "Testing without authorization token"
      - get:
          url: "/2.1/nobelPrize/{{category}}/{{year}}"
          headers:
            Accept: "application/json"
          expect:
            - statusCode: 401
      - think: 1

      # CSV Format Request
      - log: "Testing CSV format response"
      - get:
          url: "/2.1/nobelPrize/{{category}}/{{year}}"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
            Accept: "text/csv"
          expect:
            - statusCode: 200
            - contentType: "text/csv"
      - think: 2

      # Edge Case: Maximum Year
      - log: "Testing with current year"
      - get:
          url: "/2.1/nobelPrize/{{category}}/2023"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
            Accept: "application/json"
          expect:
            - statusCode: 404
      - think: 1
