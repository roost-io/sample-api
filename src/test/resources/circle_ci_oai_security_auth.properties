# API Configuration
api_baseUrl=<your-api-base-url> # Base URL for the API endpoints, defaults to https://circleci.com/api/v2
api_environment=<your-environment> # Environment name (e.g. dev, test, prod), defaults to dev

# Circle CI Authentication
circle_ci_api_key=<your-circle-ci-api-key> # Your Circle CI API token used for authentication

# Environment Variables (Optional)
# These can be set in your environment with AUTH_ prefix to override properties
# Example: AUTH_circle_ci_api_key=your-actual-key