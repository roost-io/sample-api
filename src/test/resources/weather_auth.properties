# ==============================================================================
# Weather API Authentication Configuration
# ==============================================================================
# This file contains authentication credentials and API configuration settings
# for the Weather API testing framework.
#
# Environment Variable Override:
# Any property can be overridden using environment variables with the prefix "AUTH_"
# Example: AUTH_ApiKeyAuth_apiKey=your-key-here
# ==============================================================================

# ------------------------------------------------------------------------------
# API Configuration
# ------------------------------------------------------------------------------

# Base URL for the Weather API
# Default: https://api.weatherapi.com/v1
api_baseUrl=https://api.weatherapi.com/v1

# Environment name (e.g., dev, staging, prod)
# Default: dev
api_environment=dev

# ------------------------------------------------------------------------------
# Authentication Credentials - ApiKeyAuth
# ------------------------------------------------------------------------------

# API Key for ApiKeyAuth scheme
# This key is sent as a query parameter named "key"
# Location: query parameter
# Parameter name: key
ApiKeyAuth_apiKey=<your-api-key-here>
